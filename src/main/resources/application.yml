# Cấu hình CHUNG cho mọi môi trường. KHÔNG chứa mật khẩu.
# Secret được truyền vào qua biến môi trường (UAT/PROD lấy từ Vault).
server:
  port: 8082
  shutdown: graceful            # tắt service thì xử lý nốt request đang chạy
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: customer-service      # tên dùng để đăng ký Eureka và để gateway route tới
  threads:
    virtual:
      enabled: true             # Java 21 virtual threads
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false         # tắt: tránh giữ kết nối DB suốt request, chặn query ngầm ở tầng controller
    hibernate:
      ddl-auto: validate        # chỉ KIỂM TRA entity khớp bảng, không bao giờ tự sửa DB
    properties:
      hibernate:
        jdbc:
          time_zone: UTC        # lưu thời gian theo UTC, hiển thị giờ VN là việc của tầng trên
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info    # chỉ mở endpoint cần thiết
  endpoint:
    health:
      probes:
        enabled: true

# Swagger TẮT mặc định, chỉ bật ở profile local
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
